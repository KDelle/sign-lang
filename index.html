<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesturix - Sign Language Learning</title>
    
    
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static/font/lucide.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    
    <link rel="stylesheet" href="theme-styles.css">
    <link rel="stylesheet" href="animations.css">
    
    
    <script src="theme-manager.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#e6e6fa',
                            100: '#cfcff5',
                            200: '#9f9feb',
                            300: '#6f6fe1',
                            400: '#3f3fd7',
                            500: '#0f0f6c',
                            600: '#0b0b7e',
                            700: '#0909a0',
                            800: '#0505a3',
                            900: '#040480',
                        },
                        accent: {
                            500: '#ffff02',
                            600: '#e6e602',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans leading-relaxed antialiased overflow-x-hidden m-0 p-0">
    
    <div class="fixed top-4 right-4 md:top-6 md:right-6 z-50">
        <button 
            id="themeToggle" 
            onclick="toggleTheme()" 
            class="theme-toggle-btn shadow-lg"
            aria-label="Toggle theme"
            title="Toggle theme"
        >
            <i data-lucide="sun" class="w-4 h-4"></i>
            <span class="theme-label hidden sm:inline">Light mode</span>
        </button>
    </div>

    <section class="relative w-full min-h-[100svh] flex items-center justify-center overflow-hidden px-6 md:px-8 py-8">
        <div class="relative text-center max-w-[800px] mx-auto animate-hero-fade">
            
            
            <div class="mb-8 flex justify-center">
                <img 
                    src="darkmodelogo.png"
                    alt="Gesturix Logo" 
                    class="theme-logo w-28 h-28 md:w-32 md:h-32 object-contain drop-shadow-lg"
                >
            </div>
            
            
            <div class="inline-flex items-center gap-2 px-4 py-2 bg-[var(--color-container-bg)] border border-[var(--color-border)] rounded-full text-[0.8125rem] font-medium mb-8" style="color: var(--color-text-primary);">
                <i data-lucide="hand" class="lucide lucide-hand w-4 h-4" style="color: var(--color-accent);"></i>
                <span>Learn sign language</span>
            </div>
            
            
            <h1 class="text-5xl md:text-6xl lg:text-7xl xl:text-8xl font-bold mb-5 tracking-tighter leading-tight" style="color: var(--color-text-primary);">Gesturix</h1>
            
            
            <p class="text-base md:text-lg leading-relaxed opacity-90 mb-12 max-w-[600px] mx-auto font-normal" style="color: var(--color-text-primary);">
                Master American Sign Language (ASL) and Filipino Sign Language (FSL) through interactive lessons and engaging practice.
            </p>
            
            
            <button class="px-8 py-3.5 border-none rounded-lg text-[0.9375rem] font-bold cursor-pointer transition-all duration-150 inline-flex items-center gap-2 hover:shadow-lg active:scale-[0.98]" onclick="getStarted()" style="background: var(--color-accent); color: var(--color-main-bg);">
                Get started
                <i data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4 ml-0.5"></i>
            </button>
            
            
            <div class="flex items-center justify-between gap-2 md:gap-8 mt-12 pt-12 border-t flex-nowrap w-full" style="border-color: var(--color-border);">
                <div class="flex items-center gap-1.5 opacity-80 text-xs md:text-sm" style="color: var(--color-text-primary);">
                    <i data-lucide="book-open" class="lucide lucide-book-open w-4 h-4 md:w-5 md:h-5" style="color: var(--color-accent);"></i>
                    <span>Interactive lessons</span>
                </div>
                <div class="flex items-center gap-1.5 opacity-80 text-xs md:text-sm" style="color: var(--color-text-primary);">
                    <i data-lucide="gamepad-2" class="lucide lucide-gamepad-2 w-4 h-4 md:w-5 md:h-5" style="color: var(--color-accent);"></i>
                    <span>Fun games</span>
                </div>
                <div class="flex items-center gap-1.5 opacity-80 text-xs md:text-sm" style="color: var(--color-text-primary);">
                    <i data-lucide="trophy" class="lucide lucide-trophy w-4 h-4 md:w-5 md:h-5" style="color: var(--color-accent);"></i>
                    <span>Track progress</span>
                </div>
            </div>
        </div>
    </section>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        
        function checkUserSession() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                
                window.location.href = 'home.html';
                return true;
            }
            return false;
        }
        
        
        function getStarted() {
            window.location.href = 'login.html';
        }
        
        
        window.addEventListener('DOMContentLoaded', function() {
            checkUserSession();
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
