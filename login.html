<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gesturix</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="shortcut icon" href="favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static/font/lucide.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Theme Styles -->
    <link rel="stylesheet" href="theme-styles.css">
    <link rel="stylesheet" href="animations.css">
    
    <!-- Theme Manager -->
    <script src="theme-manager.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="font-sans leading-relaxed antialiased overflow-x-hidden m-0 p-0">
    <!-- Theme Toggle Button (Fixed Position) -->
    <div class="fixed top-4 right-4 md:top-6 md:right-6 z-50">
        <button 
            id="themeToggle" 
            onclick="toggleTheme()" 
            class="theme-toggle-btn shadow-lg"
            aria-label="Toggle theme"
            title="Toggle theme"
        >
            <i data-lucide="sun" class="w-4 h-4"></i>
            <span class="theme-label hidden sm:inline">Light mode</span>
        </button>
    </div>

    <!-- LOGIN PAGE -->
    <div class="min-h-[100svh] w-full flex items-center justify-center z-[9998] transition-all duration-300 p-4 sm:p-6">
        <div class="relative rounded-xl px-6 py-6 md:px-10 md:py-12 max-w-[420px] w-full shadow-lg border animate-slide-up mx-auto" style="background: var(--color-container-bg); border-color: var(--color-border);">
            
            <!-- Back Button -->
            <button onclick="window.location.href='index.html'" class="absolute top-3 left-3 md:top-4 md:left-4 p-1.5 md:p-2 opacity-70 hover:opacity-100 transition-all duration-150 rounded-lg" style="color: var(--color-text-primary); background: transparent;">
                <i data-lucide="arrow-left" class="lucide lucide-arrow-left w-4 h-4 md:w-5 md:h-5"></i>
            </button>
            
            <!-- Logo & Header -->
            <div class="text-center mb-5 md:mb-8">
                <div class="w-16 h-16 md:w-20 md:h-20 mx-auto mb-3 md:mb-5 flex items-center justify-center">
                    <img 
                        src="darkmodelogo.png"
                        alt="Gesturix Logo" 
                        class="theme-logo w-full h-full object-contain drop-shadow-md"
                    >
                </div>
                <h2 class="text-xl md:text-2xl font-semibold mb-1 md:mb-1.5 tracking-tight" style="color: var(--color-text-primary);">Welcome back</h2>
                <p class="opacity-80 text-xs md:text-sm font-normal" style="color: var(--color-text-primary);">Sign in to continue learning</p>
            </div>
            
            <!-- Progress Steps -->
            <div class="flex items-center justify-center gap-2 mb-5 md:mb-8">
                <div id="step1-indicator" class="h-1.5 w-12 md:w-16 rounded-full transition-all duration-300" style="background: var(--color-accent);"></div>
                <div id="step2-indicator" class="h-1.5 w-12 md:w-16 rounded-full transition-all duration-300" style="background: var(--color-secondary-bg);"></div>
            </div>

            <!-- RETURNING USER FORM -->
            <form id="returningUserForm" onsubmit="handleReturningUserLogin(event)">
                <!-- Step 1: Name -->
                <div id="login-step-1" class="flex flex-col gap-3 md:gap-5">
                    <div class="flex flex-col gap-1.5 md:gap-2">
                        <label for="returningUserName" class="font-medium text-sm" style="color: var(--color-text-primary);">Name</label>
                        <input 
                            type="text" 
                            id="returningUserName" 
                            name="userName" 
                            placeholder="Enter your name" 
                            required
                            class="px-3.5 py-2.5 border rounded-lg text-sm font-sans transition-all duration-150"
                            style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                        >
                    </div>

                    <button type="button" onclick="goToLoginStep2()" class="px-4 py-2.5 border-none rounded-lg text-sm font-bold cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 hover:shadow-lg active:scale-[0.98] md:mt-2" style="background: var(--color-accent); color: var(--color-main-bg);">
                        Continue
                        <i data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4 ml-0.5"></i>
                    </button>
                </div>

                <!-- Step 2: Password -->
                <div id="login-step-2" class="flex flex-col gap-3 md:gap-5 hidden">
                    <div class="flex flex-col gap-1.5 md:gap-2">
                        <label for="returningUserPassword" class="font-medium text-sm" style="color: var(--color-text-primary);">Password</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="returningUserPassword" 
                                name="password" 
                                placeholder="Enter your password" 
                                required
                                class="w-full px-3.5 py-2.5 pr-10 border rounded-lg text-sm font-sans transition-all duration-150"
                                style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                            >
                            <button 
                                type="button" 
                                onclick="togglePassword('returningUserPassword', 'toggleReturningPassword')" 
                                class="absolute right-3 top-1/2 -translate-y-1/2 opacity-70 hover:opacity-100 transition-all duration-150"
                                style="color: var(--color-text-primary);"
                            >
                                <i data-lucide="eye" id="toggleReturningPassword" class="lucide lucide-eye w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="bg-red-900 bg-opacity-30 text-red-200 px-3 py-2 md:px-4 md:py-3 rounded-lg text-xs md:text-[0.8125rem] hidden border border-red-500 animate-shake" id="loginError"></div>

                    <div class="flex gap-2 md:gap-3">
                        <button type="button" onclick="goToLoginStep1()" class="px-3 md:px-4 py-2.5 border-none rounded-lg text-sm font-medium cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 active:scale-[0.98]" style="background: var(--color-secondary-bg); color: var(--color-text-primary);">
                            <i data-lucide="arrow-left" class="lucide lucide-arrow-left w-4 h-4"></i>
                            Back
                        </button>
                        <button type="submit" class="flex-1 px-3 md:px-4 py-2.5 border-none rounded-lg text-sm font-bold cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 hover:shadow-lg active:scale-[0.98]" style="background: var(--color-accent); color: var(--color-main-bg);">
                            Sign in
                            <i data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4 ml-0.5"></i>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Signup Link -->
            <div class="mt-4 md:mt-7 text-center">
                <p class="opacity-80 text-sm" style="color: var(--color-text-primary);">Don't have an account? <a href="signup.html" class="font-bold underline underline-offset-2 transition-colors duration-150" style="color: var(--color-accent);">Create account</a></p>
            </div>
            
            <!-- Features -->
            <div class="flex justify-center gap-3 md:gap-4 mt-4 md:mt-8 flex-wrap max-w-full">
                <div class="flex items-center gap-1.5 md:gap-2">
                    <i data-lucide="zap" class="lucide lucide-zap w-3.5 h-3.5 md:w-4 md:h-4" style="color: var(--color-accent);"></i>
                    <span class="text-[0.75rem] md:text-[0.8125rem] opacity-70 font-normal" style="color: var(--color-text-primary);">Quick & easy</span>
                </div>
                <div class="flex items-center gap-1.5 md:gap-2">
                    <i data-lucide="shield-check" class="lucide lucide-shield-check w-3.5 h-3.5 md:w-4 md:h-4" style="color: var(--color-accent);"></i>
                    <span class="text-[0.75rem] md:text-[0.8125rem] opacity-70 font-normal" style="color: var(--color-text-primary);">Secure</span>
                </div>
                <div class="flex items-center gap-1.5 md:gap-2">
                    <i data-lucide="star" class="lucide lucide-star w-3.5 h-3.5 md:w-4 md:h-4" style="color: var(--color-accent);"></i>
                    <span class="text-[0.75rem] md:text-[0.8125rem] opacity-70 font-normal" style="color: var(--color-text-primary);">Free forever</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Lucide Icons Script -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        // Step navigation
        function goToLoginStep2() {
            const nameInput = document.getElementById('returningUserName');
            if (!nameInput.value.trim()) {
                nameInput.focus();
                return;
            }
            document.getElementById('login-step-1').classList.add('hidden');
            document.getElementById('login-step-2').classList.remove('hidden');
            
            const step1 = document.getElementById('step1-indicator');
            const step2 = document.getElementById('step2-indicator');
            step1.style.background = 'var(--color-secondary-bg)';
            step2.style.background = 'var(--color-accent)';
            
            document.getElementById('returningUserPassword').focus();
            lucide.createIcons();
        }

        function goToLoginStep1() {
            document.getElementById('login-step-2').classList.add('hidden');
            document.getElementById('login-step-1').classList.remove('hidden');
            
            const step1 = document.getElementById('step1-indicator');
            const step2 = document.getElementById('step2-indicator');
            step2.style.background = 'var(--color-secondary-bg)';
            step1.style.background = 'var(--color-accent)';
            
            const errorDiv = document.getElementById('loginError');
            errorDiv.classList.add('hidden');
            lucide.createIcons();
        }
        
        // Toggle password visibility
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
        
        // Get all users from localStorage
        function getAllUsers() {
            const users = localStorage.getItem('signLanguageUsers');
            return users ? JSON.parse(users) : [];
        }

        // Hash password (simple hash for demo)
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString();
        }

        // Find user by name
        function findUserByName(name) {
            const users = getAllUsers();
            return users.find(user => user.name.toLowerCase() === name.toLowerCase());
        }

        // Handle login
        function handleReturningUserLogin(event) {
            event.preventDefault();
            
            const name = document.getElementById('returningUserName').value.trim();
            const password = document.getElementById('returningUserPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            const user = findUserByName(name);
            
            if (!user) {
                errorDiv.textContent = 'User not found. Please check your name or create a new account.';
                errorDiv.classList.add('show');
                errorDiv.classList.remove('hidden');
                return;
            }
            
            if (user.password !== hashPassword(password)) {
                errorDiv.textContent = 'Incorrect password. Please try again.';
                errorDiv.classList.add('show');
                errorDiv.classList.remove('hidden');
                return;
            }
            
            errorDiv.classList.remove('show');
            errorDiv.classList.add('hidden');
            
            const userData = {
                name: user.name,
                course: user.course,
                year: user.year
            };
            
            localStorage.setItem('currentUser', JSON.stringify(userData));
            
            // Redirect to home page
            window.location.href = 'home.html';
        }

        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'home.html';
            }
            // Initialize Lucide icons
            lucide.createIcons();
        });
    </script>
</body>
</html>
