<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Gesturix</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="shortcut icon" href="favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static/font/lucide.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Theme Styles -->
    <link rel="stylesheet" href="theme-styles.css">
    <link rel="stylesheet" href="animations.css">
    
    <!-- Theme Manager -->
    <script src="theme-manager.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="font-sans leading-relaxed antialiased overflow-x-hidden m-0 p-0">
    <!-- Theme Toggle Button -->
    <div class="fixed top-4 right-4 md:top-6 md:right-6 z-50">
        <button 
            id="themeToggle" 
            onclick="toggleTheme()" 
            class="theme-toggle-btn shadow-lg"
            aria-label="Toggle theme"
            title="Toggle theme"
        >
            <i data-lucide="sun" class="w-4 h-4"></i>
            <span class="theme-label hidden sm:inline">Light mode</span>
        </button>
    </div>

    <!-- Signup Container -->
    <div class="min-h-[100svh] w-full flex items-center justify-center z-[9998] transition-all duration-300 p-4 sm:p-6">
        <div class="relative rounded-xl px-6 py-5 md:px-10 md:py-8 max-w-[480px] w-full shadow-lg border animate-slide-up mx-auto" style="background: var(--color-container-bg); border-color: var(--color-border);">
            
            <!-- Back Button -->
            <button onclick="window.location.href='index.html'" class="absolute top-3 left-3 md:top-4 md:left-4 p-1.5 md:p-2 opacity-70 hover:opacity-100 transition-all duration-150 rounded-lg" style="color: var(--color-text-primary); background: transparent;">
                <i data-lucide="arrow-left" class="lucide lucide-arrow-left w-4 h-4 md:w-5 md:h-5"></i>
            </button>
            
            <!-- Header -->
            <div class="text-center mb-3 md:mb-5">
                <div class="w-16 h-16 md:w-20 md:h-20 mx-auto mb-3 md:mb-5 flex items-center justify-center">
                    <img 
                        src="darkmodelogo.png"
                        alt="Gesturix Logo" 
                        class="theme-logo w-full h-full object-contain drop-shadow-md"
                    >
                </div>
                <h2 class="text-xl md:text-2xl font-semibold mb-0.5 md:mb-1 tracking-tight" style="color: var(--color-text-primary);">Create account</h2>
                <p class="opacity-80 text-xs md:text-sm font-normal" style="color: var(--color-text-primary);">Start learning sign language today</p>
            </div>
            
            <!-- Step Indicators -->
            <div class="flex items-center justify-center gap-2 mb-3 md:mb-5">
                <div id="signup-step1-indicator" class="h-1.5 w-10 md:w-12 rounded-full transition-all duration-300" style="background: var(--color-accent);"></div>
                <div id="signup-step2-indicator" class="h-1.5 w-10 md:w-12 rounded-full transition-all duration-300" style="background: var(--color-secondary-bg);"></div>
                <div id="signup-step3-indicator" class="h-1.5 w-10 md:w-12 rounded-full transition-all duration-300" style="background: var(--color-secondary-bg);"></div>
            </div>
            
            <!-- Signup Form -->
            <form id="newUserForm" onsubmit="handleNewUserSignup(event)">
                
                <!-- Step 1: Name Fields -->
                <div id="signup-step-1" class="flex flex-col gap-2.5 md:gap-3">
                    <div class="flex flex-col gap-1.5">
                        <label for="firstName" class="font-medium text-sm" style="color: var(--color-text-primary);">First name</label>
                        <input 
                            type="text" 
                            id="firstName" 
                            name="firstName" 
                            placeholder="Enter your first name" 
                            required
                            class="px-3.5 py-2.5 border rounded-lg text-sm font-sans transition-all duration-150"
                            style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                        >
                    </div>
                    
                    <div class="flex gap-2.5">
                        <div class="flex flex-col gap-1.5 flex-1">
                            <label for="lastName" class="font-medium text-sm" style="color: var(--color-text-primary);">Last name</label>
                            <input 
                                type="text" 
                                id="lastName" 
                                name="lastName" 
                                placeholder="Enter your last name" 
                                required
                                class="px-3.5 py-2.5 border rounded-lg text-sm font-sans transition-all duration-150"
                                style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                            >
                        </div>
                        
                        <div class="flex flex-col gap-1.5 w-20">
                            <label for="middleInitial" class="font-medium text-sm" style="color: var(--color-text-primary);">M.I.</label>
                            <input 
                                type="text" 
                                id="middleInitial" 
                                name="middleInitial" 
                                placeholder="M.I." 
                                maxlength="2"
                                class="px-2.5 py-2.5 border rounded-lg text-sm font-sans transition-all duration-150 text-center"
                                style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                            >
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-1.5">
                        <label for="newUserCourse" class="font-medium text-sm" style="color: var(--color-text-primary);">Course</label>
                        <input 
                            type="text" 
                            id="newUserCourse" 
                            name="userCourse" 
                            placeholder="e.g., Computer Science" 
                            required
                            class="px-3.5 py-2.5 border rounded-lg text-sm font-sans transition-all duration-150"
                            style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                        >
                    </div>
                    
                    <button type="button" onclick="goToSignupStep2()" class="px-4 py-2.5 border-none rounded-lg text-sm font-bold cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 hover:shadow-lg active:scale-[0.98] mt-0.5" style="background: var(--color-accent); color: var(--color-main-bg);">
                        Continue
                        <i data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4 ml-0.5"></i>
                    </button>
                </div>
                
                <!-- Step 2: Year Level -->
                <div id="signup-step-2" class="flex flex-col gap-2.5 md:gap-3 hidden">
                    <div class="flex flex-col gap-1.5">
                        <label for="newUserYear" class="font-medium text-sm" style="color: var(--color-text-primary);">Year level</label>
                        <select id="newUserYear" name="userYear" required class="px-3.5 py-2.5 border rounded-lg text-sm font-sans transition-all duration-150 cursor-pointer" style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);">
                            <option value="">Select your year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                            <option value="Graduate">Graduate</option>
                        </select>
                    </div>
                    
                    <div class="flex gap-2 md:gap-3 mt-0.5">
                        <button type="button" onclick="goToSignupStep1()" class="px-3 md:px-4 py-2.5 border-none rounded-lg text-sm font-medium cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 active:scale-[0.98]" style="background: var(--color-secondary-bg); color: var(--color-text-primary);">
                            <i data-lucide="arrow-left" class="lucide lucide-arrow-left w-4 h-4"></i>
                            Back
                        </button>
                        <button type="button" onclick="goToSignupStep3()" class="flex-1 px-3 md:px-4 py-2.5 border-none rounded-lg text-sm font-bold cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 hover:shadow-lg active:scale-[0.98]" style="background: var(--color-accent); color: var(--color-main-bg);">
                            Continue
                            <i data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4 ml-0.5"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Step 3: Password -->
                <div id="signup-step-3" class="flex flex-col gap-2.5 md:gap-3 hidden">
                    <div class="flex flex-col gap-1.5">
                        <label for="newUserPassword" class="font-medium text-sm" style="color: var(--color-text-primary);">Password</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="newUserPassword" 
                                name="password" 
                                placeholder="Create a password" 
                                minlength="4"
                                required
                                class="w-full px-3.5 py-2.5 pr-10 border rounded-lg text-sm font-sans transition-all duration-150"
                                style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                            >
                            <button 
                                type="button" 
                                onclick="togglePassword('newUserPassword', 'toggleNewPassword')" 
                                class="absolute right-3 top-1/2 -translate-y-1/2 opacity-70 hover:opacity-100 transition-all duration-150"
                                style="color: var(--color-text-primary);"
                            >
                                <i data-lucide="eye" id="toggleNewPassword" class="lucide lucide-eye w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-1.5">
                        <label for="confirmPassword" class="font-medium text-sm" style="color: var(--color-text-primary);">Confirm password</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                placeholder="Confirm your password" 
                                minlength="4"
                                required
                                class="w-full px-3.5 py-2.5 pr-10 border rounded-lg text-sm font-sans transition-all duration-150"
                                style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                            >
                            <button 
                                type="button" 
                                onclick="togglePassword('confirmPassword', 'toggleConfirmPassword')" 
                                class="absolute right-3 top-1/2 -translate-y-1/2 opacity-70 hover:opacity-100 transition-all duration-150"
                                style="color: var(--color-text-primary);"
                            >
                                <i data-lucide="eye" id="toggleConfirmPassword" class="lucide lucide-eye w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="bg-red-900 bg-opacity-30 text-red-200 px-3 py-2 md:px-4 md:py-3 rounded-lg text-xs md:text-[0.8125rem] hidden border border-red-500 animate-shake" id="signupError"></div>
                    
                    <div class="flex gap-2 md:gap-3">
                        <button type="button" onclick="goToSignupStep2()" class="px-3 md:px-4 py-2.5 border-none rounded-lg text-sm font-medium cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 active:scale-[0.98]" style="background: var(--color-secondary-bg); color: var(--color-text-primary);">
                            <i data-lucide="arrow-left" class="lucide lucide-arrow-left w-4 h-4"></i>
                            Back
                        </button>
                        <button type="submit" class="flex-1 px-3 md:px-4 py-2.5 border-none rounded-lg text-sm font-bold cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 hover:shadow-lg active:scale-[0.98]" style="background: var(--color-accent); color: var(--color-main-bg);">
                            Create account
                            <i data-lucide="check" class="lucide lucide-check w-4 h-4 ml-0.5"></i>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Login Link -->
            <div class="mt-4 md:mt-5 text-center">
                <p class="opacity-80 text-sm" style="color: var(--color-text-primary);">Already have an account? <a href="login.html" class="font-bold underline underline-offset-2 transition-colors duration-150" style="color: var(--color-accent);">Sign in</a></p>
            </div>
            
            <!-- Features Section -->
            <div class="mt-5 md:mt-6 pt-5 md:pt-6 border-t" style="border-color: var(--color-border);">
                <div class="flex flex-wrap items-center justify-center gap-4 md:gap-6">
                    <div class="flex items-center gap-2 text-xs md:text-sm" style="color: var(--color-text-primary); opacity: 0.8;">
                        <i data-lucide="book-open" class="w-4 h-4" style="color: var(--color-accent);"></i>
                        <span>100+ lessons</span>
                    </div>
                    <div class="flex items-center gap-2 text-xs md:text-sm" style="color: var(--color-text-primary); opacity: 0.8;">
                        <i data-lucide="gamepad-2" class="w-4 h-4" style="color: var(--color-accent);"></i>
                        <span>Interactive games</span>
                    </div>
                    <div class="flex items-center gap-2 text-xs md:text-sm" style="color: var(--color-text-primary); opacity: 0.8;">
                        <i data-lucide="trophy" class="w-4 h-4" style="color: var(--color-accent);"></i>
                        <span>Track progress</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        // Step Navigation Functions
        function goToSignupStep2() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const course = document.getElementById('newUserCourse').value.trim();
            
            if (!firstName || !lastName || !course) {
                if (!firstName) document.getElementById('firstName').focus();
                else if (!lastName) document.getElementById('lastName').focus();
                else document.getElementById('newUserCourse').focus();
                return;
            }
            
            document.getElementById('signup-step-1').classList.add('hidden');
            document.getElementById('signup-step-2').classList.remove('hidden');
            updateSignupStepIndicators(2);
            document.getElementById('newUserYear').focus();
            lucide.createIcons();
        }

        function goToSignupStep1() {
            document.getElementById('signup-step-2').classList.add('hidden');
            document.getElementById('signup-step-3').classList.add('hidden');
            document.getElementById('signup-step-1').classList.remove('hidden');
            updateSignupStepIndicators(1);
            lucide.createIcons();
        }

        function goToSignupStep3() {
            const yearInput = document.getElementById('newUserYear');
            if (!yearInput.value) {
                yearInput.focus();
                return;
            }
            document.getElementById('signup-step-1').classList.add('hidden');
            document.getElementById('signup-step-2').classList.add('hidden');
            document.getElementById('signup-step-3').classList.remove('hidden');
            updateSignupStepIndicators(3);
            document.getElementById('newUserPassword').focus();
            lucide.createIcons();
        }

        function updateSignupStepIndicators(activeStep) {
            const indicators = [
                document.getElementById('signup-step1-indicator'),
                document.getElementById('signup-step2-indicator'),
                document.getElementById('signup-step3-indicator')
            ];
            indicators.forEach((indicator, index) => {
                if (index + 1 === activeStep) {
                    indicator.style.background = 'var(--color-accent)';
                } else {
                    indicator.style.background = 'var(--color-secondary-bg)';
                }
            });
        }
        
        // Toggle password visibility
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
        
        // User management functions
        function getAllUsers() {
            const users = localStorage.getItem('signLanguageUsers');
            return users ? JSON.parse(users) : [];
        }
        
        function saveAllUsers(users) {
            localStorage.setItem('signLanguageUsers', JSON.stringify(users));
        }
        
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString();
        }
        
        function findUserByName(fullName) {
            const users = getAllUsers();
            return users.find(user => user.fullName && user.fullName.toLowerCase() === fullName.toLowerCase());
        }
        
        // Handle signup
        function handleNewUserSignup(event) {
            event.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const middleInitial = document.getElementById('middleInitial').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const course = document.getElementById('newUserCourse').value.trim();
            const year = document.getElementById('newUserYear').value;
            const password = document.getElementById('newUserPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('signupError');
            
            // Build full name
            const fullName = middleInitial 
                ? `${firstName} ${middleInitial}. ${lastName}`
                : `${firstName} ${lastName}`;
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match! Please try again.';
                errorDiv.classList.remove('hidden');
                errorDiv.classList.add('show');
                return;
            }
            
            // Check if user already exists
            const existingUser = findUserByName(fullName);
            if (existingUser) {
                errorDiv.textContent = 'A user with this name already exists! Please login or use a different name.';
                errorDiv.classList.remove('hidden');
                errorDiv.classList.add('show');
                return;
            }
            
            // Create new user
            const newUser = {
                fullName: fullName,
                firstName: firstName,
                middleInitial: middleInitial,
                lastName: lastName,
                course: course,
                year: year,
                password: hashPassword(password),
                createdAt: new Date().toISOString(),
                progress: {
                    asl: {
                        learned: {
                            alphabet: [],
                            numbers: [],
                            greetings: [],
                            common: []
                        },
                        totalScore: 0,
                        quizzesTaken: 0,
                        achievements: []
                    },
                    fsl: {
                        learned: {
                            alphabet: [],
                            numbers: [],
                            greetings: [],
                            common: []
                        },
                        totalScore: 0,
                        quizzesTaken: 0,
                        achievements: []
                    }
                }
            };
            
            // Save user
            const users = getAllUsers();
            users.push(newUser);
            saveAllUsers(users);
            
            // Set current user
            const userData = {
                fullName: fullName,
                firstName: firstName,
                middleInitial: middleInitial,
                lastName: lastName,
                course: course,
                year: year
            };
            localStorage.setItem('currentUser', JSON.stringify(userData));
            
            // Success message
            alert('Account created successfully! Welcome aboard! 🎉');
            
            // Redirect to home
            window.location.href = 'home.html';
        }
        
        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'home.html';
            }
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
