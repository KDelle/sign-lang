<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Gesturix</title>
    
    <!-- < Favicon > -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="shortcut icon" href="favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static/font/lucide.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- < Theme System > -->
    <link rel="stylesheet" href="theme-styles.css">
    <link rel="stylesheet" href="animations.css">
    <script src="theme-manager.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans leading-relaxed antialiased overflow-x-hidden m-0 p-0">
    
    <!-- < Theme Toggle Button > -->
    <div class="fixed top-4 right-4 md:top-6 md:right-6 z-50">
        <button 
            id="themeToggle" 
            onclick="toggleTheme()" 
            class="theme-toggle-btn shadow-lg"
            aria-label="Toggle theme"
            title="Toggle theme"
        >
            <i data-lucide="sun" class="w-4 h-4"></i>
            <span class="theme-label hidden sm:inline">Light mode</span>
        </button>
    </div>

    <!-- < Signup Page > -->
    <div class="min-h-[100svh] w-full flex items-center justify-center z-[9998] transition-all duration-300 p-4 sm:p-6">
        <div class="relative rounded-xl px-6 py-5 md:px-10 md:py-8 max-w-[420px] w-full shadow-lg border animate-slide-up mx-auto" style="background: var(--color-container-bg); border-color: var(--color-border);">
            
            <!-- < Back Button > -->
            <button onclick="window.location.href='index.html'" class="absolute top-3 left-3 md:top-4 md:left-4 p-1.5 md:p-2 opacity-70 hover:opacity-100 transition-all duration-150 rounded-lg" style="color: var(--color-text-primary);">
                <i data-lucide="arrow-left" class="lucide lucide-arrow-left w-4 h-4 md:w-5 md:h-5"></i>
            </button>
            
            <!-- < Header > -->
            <div class="text-center mb-3 md:mb-5">
                <div class="w-12 h-12 md:w-14 md:h-14 mx-auto mb-2 md:mb-3 rounded-[0.625rem] flex items-center justify-center" style="background: var(--color-accent);">
                    <i data-lucide="hand" class="lucide lucide-hand w-6 h-6 md:w-7 md:h-7" style="color: var(--color-main-bg);"></i>
                </div>
                <h2 class="text-xl md:text-2xl font-semibold mb-0.5 md:mb-1 tracking-tight" style="color: var(--color-text-primary);">Create account</h2>
                <p class="opacity-80 text-xs md:text-sm font-normal" style="color: var(--color-text-primary);">Start learning sign language today</p>
            </div>
            
            <!-- < Progress Steps > -->
            <div class="flex items-center justify-center gap-1.5 mb-3 md:mb-5">
                <div id="step1-indicator" class="h-1 w-16 md:w-20 rounded-full transition-all duration-300" style="background: var(--color-accent);"></div>
                <div id="step2-indicator" class="h-1 w-16 md:w-20 rounded-full transition-all duration-300" style="background: var(--color-secondary-bg);"></div>
                <div id="step3-indicator" class="h-1 w-16 md:w-20 rounded-full transition-all duration-300" style="background: var(--color-secondary-bg);"></div>
            </div>

            <!-- < Signup Form > -->
            <form id="signupForm" onsubmit="handleSignup(event)">
                
                <!-- Step 1: Full Name -->
                <div id="signup-step-1" class="flex flex-col gap-2.5 md:gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label for="fullName" class="font-medium text-sm" style="color: var(--color-text-primary);">Full name</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            placeholder="Enter your name" 
                            required
                            class="px-3 py-2 md:px-3.5 md:py-2.5 border rounded-lg text-sm font-sans transition-all duration-150"
                            style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                        >
                    </div>

                    <button type="button" onclick="goToStep(2)" class="px-4 py-2 md:py-2.5 border-none rounded-lg text-sm font-bold cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 hover:shadow-lg active:scale-[0.98]" style="background: var(--color-accent); color: var(--color-main-bg);">
                        Continue
                        <i data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4"></i>
                    </button>
                </div>

                <!-- Step 2: Course -->
                <div id="signup-step-2" class="flex flex-col gap-2.5 md:gap-4 hidden">
                    <div class="flex flex-col gap-1.5">
                        <label for="course" class="font-medium text-sm" style="color: var(--color-text-primary);">Course</label>
                        <input 
                            type="text" 
                            id="course" 
                            name="course" 
                            placeholder="e.g., Computer Science" 
                            required
                            class="px-3 py-2 md:px-3.5 md:py-2.5 border rounded-lg text-sm font-sans transition-all duration-150"
                            style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                        >
                    </div>

                    <div class="flex gap-2">
                        <button type="button" onclick="goToStep(1)" class="px-3 py-2 md:py-2.5 border-none rounded-lg text-sm font-medium cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 active:scale-[0.98]" style="background: var(--color-secondary-bg); color: var(--color-text-primary);">
                            <i data-lucide="arrow-left" class="lucide lucide-arrow-left w-4 h-4"></i>
                            Back
                        </button>
                        <button type="button" onclick="goToStep(3)" class="flex-1 px-3 py-2 md:py-2.5 border-none rounded-lg text-sm font-bold cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 hover:shadow-lg active:scale-[0.98]" style="background: var(--color-accent); color: var(--color-main-bg);">
                            Continue
                            <i data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Step 3: Year & Password -->
                <div id="signup-step-3" class="flex flex-col gap-2.5 md:gap-4 hidden">
                    <div class="flex flex-col gap-1.5">
                        <label for="year" class="font-medium text-sm" style="color: var(--color-text-primary);">Year level</label>
                        <select 
                            id="year" 
                            name="year" 
                            required
                            class="px-3 py-2 md:px-3.5 md:py-2.5 border rounded-lg text-sm font-sans transition-all duration-150"
                            style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                        >
                            <option value="">Select year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                            <option value="Graduate">Graduate</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="password" class="font-medium text-sm" style="color: var(--color-text-primary);">Password</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Create a password" 
                                required
                                minlength="6"
                                class="w-full px-3 py-2 md:px-3.5 md:py-2.5 pr-10 border rounded-lg text-sm font-sans transition-all duration-150"
                                style="background: var(--color-main-bg); color: var(--color-text-primary); border-color: var(--color-border);"
                            >
                            <button 
                                type="button" 
                                onclick="togglePassword('password', 'togglePasswordIcon')" 
                                class="absolute right-3 top-1/2 -translate-y-1/2 opacity-70 hover:opacity-100 transition-all duration-150"
                                style="color: var(--color-text-primary);"
                            >
                                <i data-lucide="eye" id="togglePasswordIcon" class="lucide lucide-eye w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="bg-red-900 bg-opacity-30 text-red-200 px-3 py-2 rounded-lg text-xs md:text-sm hidden border border-red-500 animate-shake" id="signupError"></div>

                    <div class="flex gap-2">
                        <button type="button" onclick="goToStep(2)" class="px-3 py-2 md:py-2.5 border-none rounded-lg text-sm font-medium cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 active:scale-[0.98]" style="background: var(--color-secondary-bg); color: var(--color-text-primary);">
                            <i data-lucide="arrow-left" class="lucide lucide-arrow-left w-4 h-4"></i>
                            Back
                        </button>
                        <button type="submit" class="flex-1 px-3 py-2 md:py-2.5 border-none rounded-lg text-sm font-bold cursor-pointer transition-all duration-150 inline-flex items-center justify-center gap-2 hover:shadow-lg active:scale-[0.98]" style="background: var(--color-accent); color: var(--color-main-bg);">
                            Create account
                            <i data-lucide="check" class="lucide lucide-check w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </form>

            <!-- < Login Link > -->
            <div class="mt-4 md:mt-5 text-center">
                <p class="opacity-80 text-xs md:text-sm" style="color: var(--color-text-primary);">Already have an account? <a href="login.html" class="font-bold underline underline-offset-2 transition-colors duration-150" style="color: var(--color-accent);">Sign in</a></p>
            </div>
            
            <!-- < Features > -->
            <div class="flex justify-center gap-2 md:gap-3 mt-4 md:mt-6 flex-wrap max-w-full">
                <div class="flex items-center gap-1 md:gap-1.5">
                    <i data-lucide="book-open" class="lucide lucide-book-open w-3 h-3 md:w-3.5 md:h-3.5" style="color: var(--color-accent);"></i>
                    <span class="text-[0.6875rem] md:text-xs opacity-70 font-normal" style="color: var(--color-text-primary);">100+ lessons</span>
                </div>
                <div class="flex items-center gap-1 md:gap-1.5">
                    <i data-lucide="gamepad-2" class="lucide lucide-gamepad-2 w-3 h-3 md:w-3.5 md:h-3.5" style="color: var(--color-accent);"></i>
                    <span class="text-[0.6875rem] md:text-xs opacity-70 font-normal" style="color: var(--color-text-primary);">Fun games</span>
                </div>
                <div class="flex items-center gap-1 md:gap-1.5">
                    <i data-lucide="trophy" class="lucide lucide-trophy w-3 h-3 md:w-3.5 md:h-3.5" style="color: var(--color-accent);"></i>
                    <span class="text-[0.6875rem] md:text-xs opacity-70 font-normal" style="color: var(--color-text-primary);">Track progress</span>
                </div>
            </div>
        </div>
    </div>

    <!-- < Scripts > -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        /* < Step Navigation > */
        function goToStep(stepNumber) {
            if (stepNumber === 2) {
                const nameInput = document.getElementById('fullName');
                if (!nameInput.value.trim()) {
                    nameInput.focus();
                    return;
                }
            }
            if (stepNumber === 3) {
                const courseInput = document.getElementById('course');
                if (!courseInput.value.trim()) {
                    courseInput.focus();
                    return;
                }
            }
            
            document.querySelectorAll('[id^="signup-step-"]').forEach(step => step.classList.add('hidden'));
            document.getElementById(`signup-step-${stepNumber}`).classList.remove('hidden');
            
            document.querySelectorAll('[id$="-indicator"]').forEach((indicator, index) => {
                if (index < stepNumber) {
                    indicator.style.background = 'var(--color-accent)';
                } else {
                    indicator.style.background = 'var(--color-secondary-bg)';
                }
            });
            
            lucide.createIcons();
        }
        
        /* < Toggle Password > */
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
        
        /* < Get All Users > */
        function getAllUsers() {
            const users = localStorage.getItem('signLanguageUsers');
            return users ? JSON.parse(users) : [];
        }

        /* < Hash Password > */
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString();
        }

        /* < Handle Signup > */
        function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('fullName').value.trim();
            const course = document.getElementById('course').value.trim();
            const year = document.getElementById('year').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('signupError');
            
            const users = getAllUsers();
            const existingUser = users.find(user => user.name.toLowerCase() === name.toLowerCase());
            
            if (existingUser) {
                errorDiv.textContent = 'This name is already taken. Please choose a different name.';
                errorDiv.classList.remove('hidden');
                errorDiv.classList.add('show');
                return;
            }
            
            const newUser = {
                name: name,
                course: course,
                year: year,
                password: hashPassword(password),
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('signLanguageUsers', JSON.stringify(users));
            
            const userData = {
                name: newUser.name,
                course: newUser.course,
                year: newUser.year
            };
            localStorage.setItem('currentUser', JSON.stringify(userData));
            
            window.location.href = 'home.html';
        }

        /* < Check Session > */
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'home.html';
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
